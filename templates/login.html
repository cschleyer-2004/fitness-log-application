{% extends "base.html" %}
{% block title %}Login - Fitness Tracker{% endblock %}

{% block content %}
    <h1>Log In</h1>

    {% if error %}
        <p class="subtitle" style="color: #f87171;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Log In</button>
    </form>

    <p class="hint">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
{% endblock %}
