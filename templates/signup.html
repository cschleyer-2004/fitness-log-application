{% extends "base.html" %}
{% block title %}Sign Up - Fitness Tracker{% endblock %}

{% block content %}
    <h1>Create an Account</h1>

    {% if error %}
        <p class="subtitle" style="color: #f87171;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('signup') }}" class="form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">

        <button type="submit">Sign Up</button>
    </form>

    <p class="hint">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
